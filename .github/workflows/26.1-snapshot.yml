name: 26.1.2 Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - port/26.1.2-fabric
    paths:
      - "src/**"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/26.1-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Fetch TACZ compile-only dependency
        env:
          TACZ_JAR: TACZ-Refabricated-26.1.2-1.1.8+fabric.26.1.2.R2.jar
          TACZ_SHA256: fcfdfe6e6356ae5f33c7a6a439ed656f2b9f1034d09cd850a2666c7399febf6f
        run: |
          mkdir -p libs/compile_only
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o "libs/compile_only/$TACZ_JAR" \
            "https://github.com/q14433686-arch/TaCZ_Refabricated_Unofficial/releases/download/26.1.2_R2/$TACZ_JAR"
          echo "$TACZ_SHA256  libs/compile_only/$TACZ_JAR" | sha256sum -c -

      - name: Build snapshot
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v6
        with:
          name: touhoulittlemaid-fabric-26.1.2-snapshot-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-shadow.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 7
