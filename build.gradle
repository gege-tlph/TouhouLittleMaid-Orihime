plugins {
    id 'idea'
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.4.1'
    // OpenRewrite 插件，用于自动化处理 Minecraft 或者 Fabric 更新时的代码修改
    id "org.openrewrite.rewrite" version "7.35.0"
    // 质量闸：字节码静态分析（手动跑 spotbugsMain，不进默认构建），配置见文件末尾。
    // 自 1.21.11 分支照搬（隔离纪律：门禁工具以副本共享）
    id 'com.github.spotbugs' version '6.5.10'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${archives_base_name}"
}


fabricApi {
    configureDataGeneration {
        client = true
    }
}

loom {
    accessWidenerPath = file("src/main/resources/touhou_little_maid.classtweaker")
    mixin {
        defaultRefmapName = "touhou_little_maid.refmap.json"
    }
    runs {
        datagen {
            property "fabric-api.datagen.modid", "touhou_little_maid"
        }
        gametest {
            server()
            name = "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${projectDir}/build/gametest/report.xml"
            runDir "build/gametest"
        }
        // 专服联机测试用的客户端。必须与 runServer 分开 runDir：两者都用 run/ 时，
        // 正在运行的服务器锁住 run/.fabric/processedMods/*.jar，客户端重映射 mod 时删不掉，
        // 直接 FileSystemException 启动失败。
        clientDedicated {
            client()
            name = "Minecraft Client (Dedicated Test)"
            runDir "run-dedicated-client"
            // dev 客户端默认每次启动随机生成 Player### 用户名，UUID 随之改变，
            // 于是 ops.json 里上一轮授予的 OP 全部失效。钉死用户名，OP 才能跨重启保留。
            programArgs "--username", "TlmTester"
        }
    }
}

