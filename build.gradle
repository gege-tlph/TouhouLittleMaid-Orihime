plugins {
    id 'fabric-loom' version '1.17.14'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.4.1'

    id "org.openrewrite.rewrite" version "7.32.2"
    // 字节码静态分析。手动跑 spotbugsMain，不进默认构建，配置见文件末尾
    id 'com.github.spotbugs' version '6.5.10'
}
version = project.mod_version
group = project.maven_group
base {
    archivesName = "${archives_base_name}"
}
fabricApi {
    configureDataGeneration {
        client = true
    }
}
loom {
    accessWidenerPath = file("src/main/resources/touhou_little_maid.accesswidener")
    mixin {
        defaultRefmapName = "touhou_little_maid.refmap.json"
    }
    runs {
        datagen {
            property "fabric-api.datagen.modid", "touhou_little_maid"
        }
        gametest {
            server()
            name = "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${projectDir}/build/gametest/report.xml"
            runDir "build/gametest"
        }
        // 独立 runDir 的第二个客户端：同一 runDir 不能同时跑两个客户端——
        // 正在运行的实例锁住 run/.fabric/processedMods/*.jar，另一个重映射时删不掉，直接启动失败。
        clientDedicated {
            client()
            name = "Minecraft Client (Dedicated Test)"
            runDir "run-dedicated-client"
            // dev 客户端默认每次启动随机生成 Player### 用户名，UUID 随之改变，
            // 于是 ops.json 里上一轮授予的 OP 全部失效。钉死用户名，OP 才能跨重启保留。
            programArgs "--username", "TlmTester"
        }
    }
}
repositories {
    // ./libs 目录为库
    flatDir {
        dir "libs"
    }

    mavenLocal()
    mavenCentral()
    maven {
        name = "GegePatchouli"
        url = "https://raw.githubusercontent.com/gege-tlph/Patchouli/maven/"
        content {
            includeGroup "vazkii.patchouli"
        }
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel"
            includeGroup "me.shedaniel.cloth"
            includeGroup "dev.architectury"
        }
    }
    maven {
        url "https://maven2.bai.lol"
        content {
            includeGroup "mcp.mobius.waila"
            includeGroup "lol.bai"
        }
    }
    maven {
        name 'cursemaven'
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        url = "https://maven.modmuss50.me/"
    }
    maven { url 'https://maven.wispforest.io/releases' }
    maven { url 'https://maven.su5ed.dev/releases' }
    maven {
        name "reposiliteRepositoryArtifacts"
        url "https://maven.conczin.net/Artifacts"
    }
    maven { url = "https://maven.createmod.net" }
    maven { url 'https://maven.wispforest.io/releases' }
    maven { url 'https://maven.su5ed.dev/releases' }
    maven { url = "https://mvn.devos.one/releases/" }
    maven { url = "https://mvn.devos.one/snapshots/" }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        url = "https://raw.github.com/Sh1roCu/Sh1roCu_MCRepo/master/repository"
    }
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Greenhouse Maven"
        url = 'https://maven.greenhouse.lgbt/releases/'
    }
    maven {
        name = "AlexIIL"
        url = "https://staging.alexiil.uk/maven/"
    }
}
configurations {
    runtimeClasspath.extendsFrom localRuntime
    mcLib
    implementation {
        extendsFrom mcLib
    }
    additionalRuntimeClasspath {
        extendsFrom mcLib
    }
}
// TACZ 的编译期 jar。不入库，故可能缺席——缺席时让 compileJava 直接说清楚怎么补，
// 而不是让 javac 抛出几十条「找不到程序包 com.tacz」把人引向别处。
def taczCompileJar = file("libs/compile_only/TACZ-Refabricated-1.21.11-1.1.8+fabric.1.21.11.R1.jar")
tasks.named('compileJava').configure {
    doFirst {
        if (!taczCompileJar.exists()) {
            throw new GradleException(
                    "缺少 TACZ 编译期依赖：${taczCompileJar}\n" +
                    "从 https://github.com/q14433686-arch/TaCZ_Refabricated_Unofficial/releases/tag/1.21.11_R1\n" +
                    "下载 TACZ-Refabricated-1.21.11-1.1.8+fabric.1.21.11.R1.jar 放到 libs/compile_only/ 下。\n" +
                    "该 jar 体积大且许可证与本仓库不同，按约定不入库。")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation(include("org.openjdk.nashorn:nashorn-core:15.4"))
    modCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    annotationProcessor 'com.google.code.findbugs:jsr305:3.0.2'

    mcLib("org.gagravarr:vorbis-java-core:0.8")
    mcLib("io.github.jaredmdobson:concentus:1.0.2")

    mcLib "com.googlecode.soundlibs:mp3spi:1.9.5.4"

    mcLib("org.yaml:snakeyaml:2.4")

    modImplementation "maven.modrinth:jei:${jei_version}"

    modCompileOnly "maven.modrinth:architectury-api:${architectury_api_version}"
    modCompileOnly "maven.modrinth:rei:${rei_version}"
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    modImplementation "maven.modrinth:jade:${jade_version}"

    modCompileOnly("vazkii.patchouli:Patchouli:1.21.11-94.1-FABRIC") {
        // Patchouli 的静态 Maven POM 仍包含发布环境版本；依赖由本项目统一管理。
        transitive = false
    }
    // 背包排序兼容
    modImplementation "net.fabricmc:fabric-language-kotlin:1.13.10+kotlin.2.3.20"
    modImplementation "maven.modrinth:libipn:fabric-1.21.11-6.6.3"
    modImplementation "maven.modrinth:inventory-profiles-next:fabric-1.21.11-2.2.6"

    // 图形模组兼容
    modCompileOnly "maven.modrinth:sodium:mc1.21.11-0.8.11-fabric"
    modCompileOnly "maven.modrinth:iris:1.10.7+1.21.11-fabric"

    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.11.1"

    // Modrinth 与 Terraformers Maven 发布的是同一制品；直接取 JAR，避免远端 POM 故障阻断冷构建。
    modImplementation "maven.modrinth:modmenu:17.0.0@jar"

    // 森罗物语：烹饪
    modCompileOnly "maven.modrinth:kaleidoscope-cookery-refabricated:1.3.0.9-fabric+mc1.21.11"
    modCompileOnly "maven.modrinth:kaleidoscope-tavern-refabricated:1.1.2.4-fabric+mc1.21.11"

    modCompileOnly "maven.modrinth:patpat:1.2.4+1.21.11"
    modCompileOnly "software.bernie.geckolib:geckolib-fabric-1.21.1:4.7.5"

    // 农夫乐事
    modCompileOnly "maven.modrinth:farmers-delight-refabricated:1.21.11-3.4.9"
    // TACZ（枪械）—— 非官方 Fabric 移植 q14433686-arch/TaCZ_Refabricated_Unofficial 分支 1.21.11。
    // 只在 GitHub Releases 发布，没有 Maven 坐标（Modrinth 的 tacz-refabricated 停在 1.21.1），
    // 故按本地 jar 引入；jar 不入库（55 MB，且它是 GPL-3.0 而本仓库 MIT+CC）。
    // 下载地址见上方 compileJava 守卫的报错文案，缺文件时会直接打印。
    modCompileOnly files(taczCompileJar)
    modImplementation "me.zeroeightsix:fiber:0.23.0-SNAPSHOT"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.mockito:mockito-core:5.15.2"
    // 架构断言读字节码而非源码文本：直接看调用图与字段访问，没有「扫源码」那类脆弱面
    testImplementation "com.tngtech.archunit:archunit:1.4.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir layout.buildDirectory.dir("test-working")
    doFirst {
        workingDir.mkdirs()
    }
}
shadowJar {
    configurations = [project.configurations.mcLib]
    dependencies {
        exclude(dependency('junit:junit'))
    }
    archiveClassifier.set("shadow")
    enableAutoRelocation = true
    relocationPrefix = "com.github.tartaricacid.touhoulittlemaid.libs"
    exclude 'META-INF/maven/**/*'
    exclude 'META-INF/versions/**/*'
    exclude 'META-INF/LICENSE'
    exclude '.cache/**'
    mergeServiceFiles()
    minimize()
}
remapJar {
    dependsOn(shadowJar)
    inputFile = shadowJar.archiveFile
}
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}
def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.WARN
}
tasks.withType(Zip).configureEach {
    duplicatesStrategy = DuplicatesStrategy.WARN
}
tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.WARN
}
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}
rewrite {
    activeRecipe("com.github.tartaricacid.Upgrade")
}
jar {
    from("LICENSE-MIT") {
        rename { "${it}_${project.archives_base_name}" }
    }
    from("LICENSE-CC") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${project.archives_base_name}"
            from components.java
        }
    }
    repositories {
        maven {
            url "file:///D:/github_maven/Sh1roCu_MCRepo/repository"
        }
    }
}

// SpotBugs：字节码静态分析，用于查静态可变状态一类靠读码容易漏的问题。
// 插件把 spotbugsMain 挂在 check 上，因此它随 `gradlew build` 一起跑；
// ignoreFailures = true 使它只报告、不拦构建，报告在 build/reports/spotbugs/main.html。
spotbugs {
    ignoreFailures = true
    showStackTraces = false
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('HIGH')
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
}

tasks.named('spotbugsMain') {
    reports {
        html { required = true }
        xml { required = false }
    }
}

// 测试代码不跑分析：噪音大、价值低
tasks.matching { it.name == 'spotbugsTest' }.configureEach { enabled = false }
